tags:
  - Contacts
summary: Patch contact by ID
operationId: patchContact
description: 'Change a contact by ID'
security:
  - bearerAuth: []
parameters:
  - name: id
    in: path
    description: ID of the contact to patch
    schema:
      type: string
      example: 6845ded857785e9a8d0edd07
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'Alex Vas'
          phoneNumber:
            description: "Contact's phone number"
            type: string
            example: '+380670000000'
          contactType:
            description: "Contact's type"
            type: string
            enum: ['work', 'home', 'personal']
            default: 'personal'
          email:
            description: "Contact's email"
            type: string
            example: example@mail.com
          isFavourite:
            description: 'Будет ли контакт в избранном'
            type: boolean
            default: false
            example: false
          photo:
            description: "Contact's photo"
            type: string
            format: binary
responses:
  '200':
    description: Контакт успешно обновлен
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Контакт успешно обновлен!
            data:
              $ref: '../../../components/schemas/contact.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'
